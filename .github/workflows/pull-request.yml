name: "pull request workflow"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      # The rust hooks are skipped here, so no toolchain is needed in this job.
      # If SKIP below is ever removed, restore dtolnay/rust-toolchain@1.96.0.
      - name: run pre-commit on changed files
        shell: bash
        env:
          # fmt/check/clippy/test shell out to cargo and rebuild the whole
          # workspace. The "Rust fmt and clippy" and "Rust workspace" jobs below
          # already run strictly broader equivalents (--workspace --all-targets
          # --locked), so running them here too built the workspace three times
          # per PR. Everything else in .pre-commit-config.yaml still runs.
          SKIP: fmt,check,clippy,test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: build and install the itofin extension module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --no-cache-dir -r requirements-dev.txt
          maturin develop -m crates/itofin-py/Cargo.toml

      - name: run the pytest oracle
        run: |
          . .venv/bin/activate
          pytest crates/itofin-py/tests -v

  rust-lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # itofin-py needs a 3.13+ interpreter for abi3-py313 during clippy.
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Workspace members include itofin-py (abi3-py313); default runner Python is 3.12.
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: run workspace tests
        run: cargo test --workspace --locked

      - name: build workspace
        run: cargo build --workspace --locked

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
