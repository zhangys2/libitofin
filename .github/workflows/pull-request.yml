name: "pull request workflow"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: run pre-commit on changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install maturin and pytest
        run: pip install --no-cache-dir maturin pytest

      - name: build and install the itofin extension module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          maturin develop -m crates/itofin-py/Cargo.toml

      - name: run the pytest oracle
        run: |
          . .venv/bin/activate
          pytest crates/itofin-py/tests -v

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: run workspace tests
        run: cargo test --workspace --locked

      - name: build workspace
        run: cargo build --workspace --locked

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
