name: pull-request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Inline pre-commit (not the benbenbang reusable container job): that image
  # lives on a private GHCR package the fork GITHUB_TOKEN cannot pull, which
  # fails "Initialize containers" with `Error response from daemon: denied`.
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: run pre-commit on changed files
        shell: bash
        env:
          # fmt/check/clippy/test rebuild the workspace; rust-ci already covers them.
          SKIP: fmt,check,clippy,test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  check-change-files:
    name: check-changed-files
    outputs:
      rust: ${{ steps.check-changes.outputs.rust_any_modified }}
      go: ${{ steps.check-changes.outputs.go_any_modified }}
      docs: ${{ steps.check-changes.outputs.docs_any_modified }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: check validation paths
        id: check-changes
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files_yaml: |
            rust:
              - crates/**/src/**
              - crates/**/tests/**
              - crates/**/Cargo.toml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .github/workflows/*.yml

            # FFI / Go SDK / PyO3 mixed-build only. Align with
            # go-bindings-tests hook files: and go-bindings.yml on.push.paths.
            # rust-ci compiles libitofin-ffi; it does not run cbindgen/cgo.
            go:
              - crates/libitofin-ffi/**
              - crates/itofin-py/**
              - sdk/go/**
              - scripts/check_go_*
              - scripts/package_go_native.sh
              - scripts/check_release_version.py
              - scripts/publish_go_release.py
              - scripts/test_*release*.py
              - .releaserc.json
              - scripts/fixtures/go-consumer/**
              - scripts/fixtures/go-install-failures/**
              - docs/go-coverage/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .pre-commit-config.yaml
              - .github/workflows/pre-commit.yml
              - .github/workflows/go-bindings.yml
              - .github/workflows/go-package.yml
              - .github/workflows/go-release.yml

            docs:
              - README.md
              - wiki/**
              - docs/**
              - crates/itofin-py/python/**
              - crates/libitofin/examples/**
              - example/**
              - sdk/go/examples/**
              - .github/workflows/*.yml

  rust-ci:
    name: rust ci
    runs-on: ubuntu-latest
    needs: check-change-files
    if: needs.check-change-files.outputs.rust == 'true'
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: restore cargo caches
        uses: Swatinem/rust-cache@v2
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run cargo check
        run: cargo check --workspace --all-targets
      - name: run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: run tests
        run: cargo test --workspace

  # Branch protection still requires these legacy check names. Real work is in
  # `rust-ci` / `python-bindings`; these only republish under the expected names.
  rust-fmt-and-clippy:
    name: Rust fmt and clippy
    needs: [check-change-files, rust-ci]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require rust-ci success or intentional skip
        env:
          RUST: ${{ needs.check-change-files.outputs.rust }}
          RESULT: ${{ needs.rust-ci.result }}
        run: |
          if [ "$RESULT" = "success" ] || { [ "$RUST" = "false" ] && [ "$RESULT" = "skipped" ]; }; then
            exit 0
          fi
          echo "rust-ci result=$RESULT (rust paths=$RUST)" >&2
          exit 1

  rust-workspace:
    name: Rust workspace
    needs: [check-change-files, rust-ci]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require rust-ci success or intentional skip
        env:
          RUST: ${{ needs.check-change-files.outputs.rust }}
          RESULT: ${{ needs.rust-ci.result }}
        run: |
          if [ "$RESULT" = "success" ] || { [ "$RUST" = "false" ] && [ "$RESULT" = "skipped" ]; }; then
            exit 0
          fi
          echo "rust-ci result=$RESULT (rust paths=$RUST)" >&2
          exit 1

  python-bindings:
    name: python bindings
    needs: check-change-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install maturin and pytest
        run: pip install --no-cache-dir maturin pytest numpy

      - name: build and install the itofin extension module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r crates/itofin-py/typing-requirements.txt
          maturin develop -m crates/itofin-py/Cargo.toml

      - name: check the committed stubs and shims match the rust facade
        run: |
          . .venv/bin/activate
          set +e
          python crates/itofin-py/scripts/gen_stubs.py
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          git diff --exit-code -- crates/itofin-py/python
          test -z "$(git status --porcelain -- crates/itofin-py/python)"

      - name: check both directions of the typing baseline
        run: |
          . .venv/bin/activate
          python -m unittest discover -s crates/itofin-py/scripts -p 'test_*.py'
          python crates/itofin-py/scripts/check_typing.py

      - name: run the pytest oracle
        run: |
          . .venv/bin/activate
          pytest crates/itofin-py/tests -v

  python-bindings-required:
    # Exact name branch protection expects (lowercase; not the matrix
    # "python bindings (3.10)" / "(3.13)" variants, and not "Python bindings").
    name: python bindings
    needs: python-bindings
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require python-bindings matrix success
        env:
          RESULT: ${{ needs.python-bindings.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            exit 0
          fi
          echo "python-bindings result=$RESULT" >&2
          exit 1

  # Keep the title-case name too in case protection was saved that way.
  python-bindings-required-titlecase:
    name: Python bindings
    needs: python-bindings
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require python-bindings matrix success
        env:
          RESULT: ${{ needs.python-bindings.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            exit 0
          fi
          echo "python-bindings result=$RESULT" >&2
          exit 1

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  go-bindings:
    needs: check-change-files
    if: needs.check-change-files.outputs.go == 'true'
    uses: ./.github/workflows/go-bindings.yml

  go-package:
    needs: check-change-files
    if: needs.check-change-files.outputs.go == 'true'
    uses: ./.github/workflows/go-package.yml

  docs:
    needs: check-change-files
    if: needs.check-change-files.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build site (strict)
        working-directory: docs
        run: uv run --frozen mkdocs build --strict

  workflow-success:
    name: workflow-success
    needs: [check-change-files, pre-commit, rust-ci, python-bindings, go-bindings, go-package, docs]
    # Skip when the workflow itself is cancelled (e.g. superseded by a newer
    # synchronize/edited run under cancel-in-progress). Otherwise `always()`
    # leaves a failing workflow-success check on the commit that blocks merge
    # even after a later green run on the same SHA.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          paths = needs["check-change-files"]["outputs"]
          conditional = {"rust-ci": "rust", "go-bindings": "go", "go-package": "go", "docs": "docs"}
          failed = False
          for job, details in needs.items():
              result = details["result"]
              flag = paths.get(conditional[job]) if job in conditional else "true"
              accepted = flag in ("true", "false") and (
                  result == "success" or (result == "skipped" and flag == "false")
              )
              print(f"{job}: {result} (required: {flag})", flush=True)
              failed |= not accepted
          sys.exit(1 if failed else 0)
